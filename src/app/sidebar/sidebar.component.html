<!-- =========================================================
     FLOATING NAVIGATION
     ========================================================= -->

<div class="floating-navigation" [class.is-hidden]="isHidden" [class.is-entering]="isEntering"
  [class.is-dragging]="isDragging" [style.left.px]="sidebarLeft" [style.top.px]="sidebarTop"
  (pointerdown)="onDragStart($event)" (pointermove)="onDragMove($event)" (pointerup)="onDragEnd($event)"
  (pointercancel)="onDragEnd($event)" (lostpointercapture)="onDragEnd()">

  <!-- =======================================================
       EDGE LIGHT
       ======================================================= -->

  <div class="card-edge-glow"></div>

  <!-- =======================================================
       NAVIGATION CARD
       ======================================================= -->

  <div class="navigation-card">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="navigation-header">

      <!-- RESET BUTTON -->

      <button type="button" class="sidebar-reset-button" aria-label="Reset sidebar position"
        title="Reset sidebar position" (click)="resetSidebarPosition($event)">
        <span class="reset-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 12a8 8 0 1 0 2.34-5.66" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />

            <path d="M4 5v5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </span>

        <span class="reset-copy">
          <span class="reset-title">
            Reset
          </span>

          <span class="reset-description">
            Position
          </span>
        </span>
      </button>

      <!-- AVAILABLE STATUS -->

      <div class="header-status">
        <span class="status-indicator"></span>

        <div class="status-copy">
          <span class="status-label">
            AVAILABLE
          </span>
        </div>
      </div>

    </header>

    <!-- =====================================================
         DRAG HINT
         ===================================================== -->

    <div class="drag-hint" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- =====================================================
         MAIN NAVIGATION
         ===================================================== -->

    <nav class="navigation-links" aria-label="Main navigation">

      <!-- ABOUT -->

      <a href="#about" class="navigation-link" aria-label="About" (click)="goToStation($event, 0)">
        <span class="active-line"></span>

        <span class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="1.7" />

            <path d="M4.5 20c.8-4 3.2-6 7.5-6s6.7 2 7.5 6" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" />
          </svg>
        </span>

        <span class="navigation-copy">
          <span class="navigation-text">
            About
          </span>

          <span class="navigation-description">
            Who I am
          </span>
        </span>

        <span class="link-arrow">
          ↗
        </span>
      </a>

      <!-- PROJECTS -->

      <a href="#projects" class="navigation-link" aria-label="Projects" (click)="goToStation($event, 1)">
        <span class="active-line"></span>

        <span class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.7" />

            <path d="M8 9h8M8 13h5M8 17h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
        </span>

        <span class="navigation-copy">
          <span class="navigation-text">
            Projects
          </span>

          <span class="navigation-description">
            Selected work
          </span>
        </span>

        <span class="link-arrow">
          ↗
        </span>
      </a>

      <!-- SKILLS -->

      <a href="#technologies" class="navigation-link" aria-label="Skills" (click)="goToStation($event, 2)">
        <span class="active-line"></span>

        <span class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m12 3 2.4 5.1L20 9l-4 3.9.9 5.6L12 16l-4.9 2.5.9-5.6L4 9l5.6-.9L12 3Z" stroke="currentColor"
              stroke-width="1.7" stroke-linejoin="round" />
          </svg>
        </span>

        <span class="navigation-copy">
          <span class="navigation-text">
            Skills
          </span>

          <span class="navigation-description">
            Technology stack
          </span>
        </span>

        <span class="link-arrow">
          ↗
        </span>
      </a>

    </nav>

    <!-- =====================================================
         QUICK ACTIONS
         ===================================================== -->

    <div class="quick-actions">

      <!-- GITHUB -->

      <a class="quick-action" [href]="githubUrl" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <span class="quick-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 .7a11.3 11.3 0 0 0-3.58 22c.57.1.78-.25.78-.55v-2.1c-3.17.69-3.84-1.34-3.84-1.34-.52-1.33-1.27-1.69-1.27-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.67 1.25 3.32.96.1-.74.4-1.25.72-1.54-2.53-.29-5.2-1.27-5.2-5.66 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.12 1.17a10.8 10.8 0 0 1 5.68 0c2.17-1.48 3.12-1.17 3.12-1.17.62 1.57.23 2.73.11 3.02.74.8 1.18 1.82 1.18 3.07 0 4.4-2.67 5.37-5.21 5.65.41.35.77 1.05.77 2.12v3.13c0 .3.2.66.79.55A11.3 11.3 0 0 0 12 .7Z" />
          </svg>
        </span>

        <span class="quick-label">
          GitHub
        </span>
      </a>

      <!-- EMAIL -->

      <a class="quick-action" [href]="emailUrl" aria-label="Email">
        <span class="quick-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.7" />

            <path d="m5 7 7 5 7-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </span>

        <span class="quick-label">
          Email
        </span>
      </a>

    </div>

  </div>
</div>


<!-- =========================================================
     THEME BUTTON
     ========================================================= -->

<button type="button" class="quick-theme-toggle" (click)="onThemeToggle()" [attr.aria-label]="
    currentTheme === 'dark'
      ? 'Switch to light mode'
      : 'Switch to dark mode'
  ">

  <span class="theme-glow"></span>

  <!-- DARK MODE -->

  <svg *ngIf="currentTheme === 'dark'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7" />

    <path
      d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"
      stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
  </svg>

  <!-- LIGHT MODE -->

  <svg *ngIf="currentTheme !== 'dark'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z" stroke="currentColor" stroke-width="1.7"
      stroke-linejoin="round" />
  </svg>

</button>
